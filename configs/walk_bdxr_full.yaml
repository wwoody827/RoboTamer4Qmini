# walk_bdxr_full.yaml — faithful BDX-R-MjLab reproduction.
#
# Source: https://github.com/BDX-R/BDX-R-MjLab
# Recipe matches BDX-R's legs variant (10-DoF biped, no upper body) as
# closely as Qmini's hardware constraints allow.
#
# Differences from BDX-R-MjLab (documented, kept on purpose):
#   • Policy rate 66.67 Hz (BDX-R 50 Hz). Qmini control rate is 67 Hz.
#   • No terrain levels curriculum (would require recompile).
#   • No heading-command yaw error term (BDX-R uses heading PID; we use
#     direct yaw_rate cmd).
#   • No encoder bias DR (separate feature, not yet implemented).
#
# Everything else is reproduced: obs slots, action mode, reward set, DR.

task:
  cfg: BDXR
  use_teacher_obs: false

phase:
  mode: none                       # NO phase clock in obs

observation:
  history: 5
  skip: 2
  # 6 slots × 5 frames = 165 dim. Matches BDX-R-MjLab actor obs:
  #   command (3) + base_ang_vel (3) + projected_gravity (3)
  #   + joint_pos_err (10) + joint_vel (10) + joint_tracking_err (10)
  slots:
    - commands_3
    - base_ang_vel
    - projected_gravity            # NEW slot (3-dim, IMU-style)
    - joint_pos_err
    - joint_vel
    - joint_tracking_err

action:
  # Hardware-aware action setup inherited from walk_rl (kept identical to
  # walk_v34's tested config — DO NOT change without verifying against
  # Qmini's URDF joint limits, motor effort, and PD gains).
  #
  # BDX-R-MjLab uses `action_scale = 0.25 × effort/stiffness ≈ 0.15` per
  # joint as a HARDWARE-DERIVED smoothness cap, plus high kd damping
  # (kd=5.0 for hip/knee vs Qmini's kd=0.3). Their action_rate_l2 reward
  # then provides additional smoothing.
  #
  # We achieve equivalent action smoothness on Qmini via:
  #   • URDF joint limits as the absolute action range (abs_low/high=null)
  #   • action_lowpass_alpha=0.75 (60ms TC, walk_v34-tested)
  #   • action_rate_l2 reward (BDX-R style, weight 0.1)
  #
  # Net effect: per-step joint target ΔJ ≤ ~0.15 rad (matches BDX-R's cap).
  action_mode: absolute
  action_lowpass_alpha: 0.75       # walk_rl default — preserves smoothness
  abs_low_ranges:  null            # fall back to URDF joint limits
  abs_high_ranges: null
  ref_joint_pos: [0.4, -0.1, -1.5, 1.0, -1.3,
                  -0.4, 0.1, 1.5, -1.0, 1.3]

command:
  num_commands: 4
  resampling_time: 5.0             # BDX-R uses 3-8s uniform; we use ~midpoint
  heading_command: false
  use_heading_reward: false
  lin_vel_x_range:   [-1.0, 1.0]   # match BDX-R range
  lin_vel_y_range:   [-0.4, 0.4]
  ang_vel_yaw_range: [-1.0, 1.0]
  regime: null                     # uniform — no pure_and_pairs limitation

reward:
  # ── Tracking (BDX-R style gaussian) — kept as our linear shape since
  #    the magnitudes work out similarly; can switch to gaussian if needed.
  fwd_vel:        2.0              # track_linear_velocity (x component)
  lateral_vel:    2.0              # track_linear_velocity (y component)
  yaw_rat:        2.0              # track_angular_velocity
  fwd_err_slope:      3.0
  lateral_err_slope:  3.0
  yaw_err_slope:      3.0
  cmd_track_lp_alpha: 0.0          # OFF — BDX-R uses direct error
  reg_use_norm_scaling: false

  # ── BDX-R posture set ─────────────────────────────────────────────────
  upright:        1.5              # exp(-||g_xy||²/σ²) — BDX-R uses √0.1
  upright_std:    0.316            # = √0.1 (BDX-R-MjLab exact value)

  pose_speed:     1.0              # speed-conditional pose deviation
  # Per-joint std lists (matches BDX-R legs variant; 10 values, ordered as
  # left hip_yaw/roll/pitch, knee, ankle, then right):
  pose_std_per_joint_standing:
    [0.05, 0.05, 0.05, 0.05, 0.05,
     0.05, 0.05, 0.05, 0.05, 0.05]
  pose_std_per_joint_walking:
    [0.15, 0.04, 0.50, 0.50, 0.10,
     0.15, 0.04, 0.50, 0.50, 0.10]
  pose_std_per_joint_running:
    [0.20, 0.04, 0.80, 0.80, 0.50,
     0.20, 0.04, 0.80, 0.80, 0.50]
  pose_walking_threshold: 0.05     # BDX-R exact (any cmd > 0.05 = walking)
  pose_running_threshold: 0.10     # ours much lower than BDX-R 1.0 since cmd range is similar

  # ── Foot rewards (BDX-R legs variant weights) ─────────────────────────
  feet_swing_height_peak: 3.0      # weight 3 (negated by L2 sign — see code)
  feet_swing_target:      0.06     # BDX-R exact target

  foot_slip:      0.20             # BDX-R = -0.2 (our 0.2 = magnitude)

  soft_landing:   2.0e-5           # BDX-R = -2e-5 (our +2e-5 since landing
                                   # rew is computed as -foot_frc×event ≤ 0)

  # ── BDX-R penalty terms (new) ─────────────────────────────────────────
  action_rate_l2: 0.1              # weight scaled to magnitude; sign already - in code
  body_ang_vel:   0.2              # BDX-R legs variant uses -0.2
  dof_pos_limits: 1.0              # BDX-R = -1.0

  # ── air_time ───────────────────────────────────────────────────────────
  air_time:       1.5              # BDX-R legs override 1.5

  # ── EVERYTHING ELSE OFF ───────────────────────────────────────────────
  base_heit:        0.0            # no base_height bell (BDX-R uses height_scan only in critic)
  base_heit_l2:     0.0
  flat_orient_l2:   0.0            # replaced by upright bell
  foot_phase:       0.0            # NO phase clock
  foot_clr:         0.0            # subsumed by feet_swing_height_peak
  foot_supt:        0.0
  foot_heit:        0.0            # legacy clip-saturated form OFF
  foot_heit_form:   clip
  foot_clearance_l2: 0.0
  foot_stand:       0.0
  balance:          0.0            # subsumed by upright + pose_speed
  twist:            0.0
  vertical_vel:     0.0
  ang_vel:          0.0
  base_acc:         0.0
  leg_width_rew:    0.0
  feet_py:          0.0
  jnt_pos_err:      0.0            # replaced by pose_speed
  act_const:        0.0
  sa_const:         0.0
  power:            0.0
  act_smo:          0.0            # replaced by action_rate_l2 (1st-deriv form)
  jnt_vel:          0.0
  joint_tor:        0.0
  pmf:              0.0
  heading:          0.0
  yaw_smooth:       0.0
  foot_sft:         0.0
  foot_vz:          0.0
  foot_acc:         0.0
  feet_frc:         0.0
  net_smo:          0.0
  net_out_val:      0.0
  constant:         0.0

  component_clip_min: -4.0
  component_clip_max:  5.0

# ── Domain randomisation — match BDX-R ranges ───────────────────────────
domain_rand:
  randomize_friction: true
  friction_range: [0.3, 1.2]       # BDX-R foot_friction
  rest_offset_range: [0.0, 0.0]

  randomize_mass: true
  added_mass_range: [0.8, 1.3]     # BDX-R body_mass scale
  added_inertia_range: [0.8, 1.3]
  randomize_damping: true
  added_friction_range: [0.8, 1.3]
  added_damping_range:  [0.7, 1.3]

  randomize_torque: false          # BDX-R doesn't apply torque DR explicitly
  torque_range: [1.0, 1.0]
  torque_noise_std: 0.0

  randomize_gains: true
  gains_range: [0.7, 1.3]          # BDX-R pd_gains

  push_robots: true
  max_push_vel_xy: 0.5             # BDX-R x/y ±0.5
  max_push_rate_xyz: 0.78          # BDX-R yaw ±0.78
  push_interval_s: 2.0             # BDX-R 1-3s uniform — use midpoint 2.0

  delay_observation: true
  delay_joint_ranges: [1, 50]
  delay_angle_ranges: [1, 60]
  delay_rate_ranges:  [1, 60]

# Inherit the rest (init_state, terrain, sim, asset, viewer, runner, policy,
# algorithm, pd_gains, noise_values) from walk_rl baseline.
_base: walk_rl.yaml
