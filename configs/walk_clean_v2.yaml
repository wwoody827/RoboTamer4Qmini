# walk_clean_v2.yaml — fresh start with V2Task + v2_train.py.
#
# Stand-only task (cmd=0). Run with: python v2_train.py --config configs/walk_clean_v2.yaml --name <name>

_base: base.yaml

task:
  cfg: V2
  tilt_term_rad: 0.7
  base_z_min: 0.2

# Stand task uses a perfectly flat plane (matches MuJoCo deploy ground).
# base.yaml default is `trimesh` with vertical_scale 0.01 → up to ~1cm of
# numerical bumps even when terrain_proportions selects "flat" cells. That
# biases the policy toward foot-tilt-locking strategies that catch corners
# of the foot against bumps. The strategy is brittle and fails in MuJoCo's
# clean plane (~5s then fall). Plane terrain here closes the gap — v2_run25
# stands 15s+ in MuJoCo with <3cm drift.
terrain:
  mesh_type: plane

phase:
  mode: none

observation:
  history: 5
  skip: 2

action:
  action_mode: residual
  action_lowpass_alpha: 0.75
  residual_low_ranges:  [-0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5]
  residual_high_ranges: [+0.5, +0.5, +0.5, +0.5, +0.5, +0.5, +0.5, +0.5, +0.5, +0.5]

command:
  lin_vel_x_range:   [0.0, 0.0]
  lin_vel_y_range:   [0.0, 0.0]
  ang_vel_yaw_range: [0.0, 0.0]
  resampling_time:   5.0

# DR — narrow ranges for sim2real robustness without forcing the policy
# into "move-to-stay-upright" strategies (which is what wide push DR did).
# push_robots stays off (it was the spin-balance trigger). Everything else
# is back on at conservative ±5–10% ranges.
domain_rand:
  randomize_friction:   true
  friction_range:       [0.7, 1.5]
  randomize_mass:       true
  added_mass_range:     [0.9, 1.1]    # ±10% body-segment mass
  added_inertia_range:  [0.9, 1.1]    # ±10% inertia
  randomize_damping:    true
  added_friction_range: [0.95, 1.05]  # ±5% joint friction
  added_damping_range:  [0.9, 1.1]    # ±10% joint damping
  randomize_torque:     true
  torque_range:         [0.95, 1.05]  # ±5% actuator gain
  torque_noise_std:     0.0
  randomize_gains:      true
  gains_range:          [0.95, 1.05]  # ±5% PD gains
  push_robots:          false         # KEEP OFF — wide pushes train spin-balance
  delay_observation:    true          # real sensor latency 10–40 ms
# Sensor noise: use base.yaml defaults (lin_vel 0.3, gravity 0.15, ang_vel 0.3,
# foot_frc 5.0, dof_pos 0.1, dof_vel 1.2, base_acc 3.0). Previously cut 5-6×
# while diagnosing sim2sim gap — now that gap is solved by `terrain.plane`,
# full noise gives sim2real margin without breaking training.

reward:
  # 10 terms — see env/tasks/v2_task.py REWARD_NAMES for layout.
  # Removed (from original 15): foot_geometry (FK-redundant), xy_drift
  # (walk-incompatible), torque (small/constant cost), joint_velocity
  # (v32 ablation showed it's not critical), yaw_rate_lock (absorbed into
  # angular_velocity via deeper L2 floor — see angular_velocity_l2_weight).
  target_z:                  0.45
  base_height_scale:         0.08    # loosened 0.04→0.08 to tolerate ±5-10% physics DR
  upright_scale:             0.30
  linear_velocity_scale:     0.10    # loosened 0.05→0.10 (DR adds ~5cm/s wobble)
  angular_velocity_scale:    0.20    # bell on (yaw_rate-cmd_yaw)² + 0.3·rp_avel²
  angular_velocity_l2_weight: 1.0    # deep L2 floor — at saturation gives -1.0 (absorbs yaw_rate_lock)
  body_rate_lock_scale:      1.0     # rad/s — L2 for combined roll/pitch rate
  pose_match_scale:          2.5     # rad — relaxed 1.5→2.5: lifting a leg (err²≈0.5) costs only 0.24 reward instead of 0.6
  foot_slip_scale:           0.10    # m/s — loosened 0.05→0.10 for DR tolerance
  foot_rotation_scale:       0.30    # rad/s — planted foot must not pivot
  contact_threshold:         5.0     # N — foot is "in contact" above this
  w_base_height:             2.0
  w_upright:                 2.0
  w_linear_velocity:         2.0
  w_angular_velocity:        2.0     # bumped 1→2 so saturated L2 gives -2.0 (= old yaw_rate_lock)
  w_body_rate_lock:          3.0     # L2 on rp_avel: stops pitch/roll hovering
  w_pose_match:              3.0     # joint-space pull to ref (defeats squat local-min)
  w_foot_slip:               1.5
  w_foot_rotation:           1.5
  w_action_smoothness:       1.0
  w_termination:            20.0     # 50→20 to weaken "long survival" red herring

policy:
  hidden_layers: [512, 256]
  activation: relu
  init_noise_std: 0.5

algorithm:
  entropy_coef:        0.0005
  num_learning_epochs: 3
  discount_factor:     0.995
