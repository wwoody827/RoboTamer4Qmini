# BD_X-style walking — external phase clock + absolute position targets
# 10-dim action (joints only), contact-force foot masks, lowpass smoothing
_base: base.yaml

task:
  cfg: BIRL
  foot_mask_mode: contact

phase:
  mode: input
  # Phase frequency is now a deploy-time command. Policy sees a normalized
  # freq scalar and sin/cos of the phase; during training we sample uniformly
  # from [freq_low, freq_high] per env. At deploy, pass --cmd_freq.
  freq_low: 2.0
  freq_high: 3.0
  freq_default: 2.5

action:
  action_mode: absolute
  action_lowpass_alpha: 0.75
  # abs_*_ranges: joint position target bounds for absolute mode (null = URDF limits).
  # Not set here — defaults to URDF joint limits, which is the right thing for BD_X.

observation:
  slots:
    - commands_3
    - base_euler
    - base_ang_vel
    - joint_pos_err
    - joint_vel
    - joint_tracking_err
    - phase_clock
    - phase_freq_cmd

reward:
  pmf: 0.0
  foot_phase: 3.0
  power: 0.1
  air_time: 1.0
