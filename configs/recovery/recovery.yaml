# Fall-recovery policy — episodic, no command, no phase, 10-dim absolute action.
# Baseline: dense shaping (shaping_static) + terminal.
# Compose orthogonal reward groups via reward.groups_enabled.
_base: base.yaml

task:
  cfg: Recovery
  init_states_path: data/recovery_init_states.npz
  target_height: 0.45             # informational only (PD-to-ref lands here)
  success_pose_err: 0.3           # success: ||q - q_ref|| < this
  success_tilt_deg: 25.0          # success: tilt < this
  # 4-stage curriculum: starts with near-nominal poses, advances on rolling success.
  curriculum:
    enabled: true
    replay_old_frac: 0.20         # mix in 20% from earlier stages once past stage1
  # Disable BIRL-only fields that base inherits (harmless for Recovery, kept tidy):
  use_teacher_obs: false
  ref_clip_paths: []

phase:
  mode: none

action:
  action_mode: absolute
  action_lowpass_alpha: 0.5       # stronger smoothing than walking (recovery is slower / safer)
  abs_high_ranges: null           # use URDF joint limits
  abs_low_ranges: null

observation:
  history: 1                       # Markovian — no temporal stacking
  slots:
    - base_euler                   # 2
    - base_ang_vel                 # 3
    - joint_pos_err                # 10  (joint_pos - ref_joint_pos)
    - joint_vel                    # 10
    - joint_tracking_err           # 10  (current_joint_act - joint_pos)
    - projected_gravity            # 3
    - episode_progress             # 1
                                    # total: 39
runner:
  seed: 1
  max_iterations: 10000
  num_steps_per_env: 24
  save_interval: 200
  num_envs: 4096
  env_spacing: 3.
  send_timeouts: true
  episode_length_s: 5              # 5 s episodes
  use_mirror_augmentation: false   # mirror not yet supported for recovery obs
  mirror_weight: 0.0

policy:
  hidden_layers: [512, 256]
  activation: relu

algorithm:
  entropy_coef: 0.001              # encourage exploration in early training
  num_learning_epochs: 3
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  discount_factor: 0.99            # shorter horizon (5 s episodes)

# Recovery does not consume velocity commands — keep ranges zero so the BIRL
# resample machinery (if accidentally invoked) does not crash. RecoveryTask
# does not call _resample_commands itself.
command:
  num_commands: 4
  resampling_time: 5.
  lin_vel_x_range: [0., 0.]
  lin_vel_y_range: [0., 0.]
  ang_vel_yaw_range: [0., 0.]

# Init state defaults (overridden per-env on reset by the .npz pool):
init_state:
  random_rot: false
  pos: [0., 0., 0.45]
  rot: [0., 0., 0., 1.]
  reset_joint_pos: [0.4, -0.1, -1.5, 1., -1.3, -0.4, 0.1, 1.5, -1., 1.3]

# Domain randomization — keep base defaults but disable pushes (recovery should
# learn from the *settled* fallen pose; pushes during the episode would dilute
# the signal). DR on physical parameters (friction, mass, gains, torque) stays on.
domain_rand:
  push_robots: false
  delay_observation: false         # Layer A keeps it simple; turn on later phases
  torque_noise_std: 1.0            # +per-step Nm noise; recovery loads gears hard

# Reward groups — baseline: dense shaping_static + sparse terminal so the
# policy gets a continuous gradient AND a clear ±5 success/failure signal.
reward:
  groups_enabled:
    - shaping_static
    - terminal
  # shaping_static weights + exp sharpness (smaller k = softer / wider gradient).
  pose_match: 1.0
  pose_match_k: 8.0      # exp(-k * ||q - q_ref||^2); k=8 → ~0.5 at ||err||=0.3
  orientation: 1.0
  orientation_k: 0.5     # exp(-k * tilt^2); k=0.5 → ~0.85 at 25°
  # stability (gated by groups_enabled)
  stability: 1.0
  # smoothness (negative weights = penalties)
  action_rate:    -0.01
  action_jerk:    -0.005
  joint_vel_pen:  -0.0005
  torque_pen:     -0.0001
  # safety
  joint_limit:    1.0
  contact_force:  1.0
  # terminal: +w if upright at episode end, -w otherwise.
  terminal:       5.0
