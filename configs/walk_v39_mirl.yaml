# walk_v39_mirl — MIRL best baseline. Inherits walk_v34 reward stack and adds:
#   1. Motion-imitation reward from a curated demo dataset (BC-style traces
#      filtered for tracking + freq lock + tilt + torque, cmd_relabel applied).
#   2. Full RSI: robot is reset to a clip frame's joint + base state, with
#      small Gaussian noise on top to preserve DR diversity.
#   3. Cmd-matched clip selection: each env's clip is the closest match by
#      L2 in cmd_relabel space (top-3 nearest, sampled uniformly).
#   4. w_imit anneals 0.4 → 0.0 over 3000 iters so the policy gets a scaffold
#      early and then is owned entirely by task reward in the late phase.
#   5. Slightly stronger foot_phase + air_time to lock measured gait freq
#      to the external clock (without strangling tracking like 1.0 did).
#
# Dataset: data/datasets/walk_combined_freq_locked
#   437 HQ traces / 85 min, recorded from walk_v34 (9 ckpts) + walk_v38 (6 ckpts)
#   across cmd_freq ∈ {2.0, 2.25, 2.5, 2.75, 3.0} Hz and floor_friction
#   ∈ {0.3, 0.7, 1.0, 1.5, 2.5} (DR domain). Strict filter:
#     - in-distribution cmds only (matches pure_and_pairs regime)
#     - clean class (uncmd-axis drift below threshold)
#     - tracking_eff ≥ 0.6 on each commanded axis (no stand-and-sway)
#     - max_uncmd_drift_yaw ≤ 0.05 rad/s (no spinning while strafing)
#     - max_tilt ≤ 12° (no near-tipping)
#     - max_peak_tau_ratio ≤ 1.2× (no motor saturation)
#     - max_freq_dev ≤ 0.3 Hz vs per-trace cmd_freq (gait freq locked)
#     - cmd_relabel (mean realized on commanded axes) used for cmd matching
#       so student is taught what is actually achievable, not the issued cmd.
#
# Robustness: imitation reward and RSI only use joint state + base state +
# cmd_const from the clips. Switching obs slots, frame-stacking, action_dim,
# or network arch leaves the imitation pipeline unchanged.
_base: walk_v34.yaml

reward:
  # Frequency lock — stronger pressure to match external clock without
  # being so high it strangles tracking (1.0 collapsed training to standstill).
  foot_phase: 0.6           # base 0.3 → 0.6 (2×)
  air_time:   1.5           # walk_v34 1.0 → 1.5 (50% bump on swing-duration)

task:
  # MIRL pipeline (gated by ref_clip_dataset != null in env/tasks/birl_task.py).
  ref_clip_dataset: data/datasets/walk_combined_freq_locked
  ref_cmd_match: true       # match clip-to-env by cmd_relabel L2
  ref_cmd_topk:   3         # uniform sample within 3 nearest (keeps diversity)
  ref_rsi_state:  true      # full RSI from clip frame (joint + base state)
  ref_rsi_jnt_noise: 0.05   # ± rad noise on joints
  ref_rsi_vel_noise: 0.10   # ± noise on joint/base velocities

  # Imitation weight anneal: scaffold early, pure RL late.
  w_imit_start: 0.4
  w_imit_end:   0.0
  w_imit_decay_iter: 3000   # linear interp end
  w_task: 1.0               # task reward stays full strength throughout
