# walk_noclock_v5.yaml — Cassie-style (clock for reward, NOT in obs)
#                        + BDX-R reward design + Qmini hardware-aware tuning
#
# Tonight's revival of the no-clock-in-obs goal. Earlier attempts:
#   v1: air_time only, no foot_stand   → regressed during training
#   v2: + foot_stand                   → killed early (broken sim2sim metric)
#   v3: Cassie periodic reward         → 92 % of walk_v34, late overfit
#   v4: v2 + longer history + act DR   → killed for v3 path
#
# What's new in v5 vs v3:
#   • Use BDX-R-style `pose_speed` (speed-conditional std PER JOINT) — the
#     single biggest insight from the BDX-R recipe. Tight at stand → forces
#     ref pose, loose at walk → allows leg swing.
#   • Use BDX-R `feet_clearance_l1` + `feet_swing_height_peak` + `soft_landing`
#     for foot dynamics — proven L1 cmd-gated form, harder to game than v3's
#     foot_clr/heit alone.
#   • Use BDX-R `upright` exp bell (replaces v3's `flat_orient_l2` direction).
#   • `projected_gravity` (3-dim) replaces `base_euler` (2-dim) in obs —
#     IMU-style, more robust at large tilts.
#
# What we DON'T copy from BDX-R (per `docs/bdxr_reproduction.md` outcome):
#   • Hard body_ang_vel (-0.2) / angular_momentum (-0.04) — assumes BDX-R's
#     kd=5.0 passive damping; Qmini's kd=0.3 needs ACTIVE body rotation
#     for balance, so these would suppress the very corrections needed.
#   • BDX-R hyperparams (entropy 0.01, 3-layer ELU, init_noise 1.0) — caused
#     training to stall in our setup. Keep walk_rl's tuned values.
#   • BDX-R cmd_vel curriculum (deferred TODO).
#
# What we KEEP from walk_v34/walk_rl (proven to transfer on Qmini):
#   • `cmd_track_lp_alpha: 0.95` — anti-Jensen-gaming gait-sway filter.
#   • Tracking shape: linear `1 − clip(α|err|)` (not BDX-R gaussian) —
#     scaled to Qmini's torque magnitudes.
#   • Industry-aligned regulators (act_smo 0.30, jnt_vel 1e-3, joint_tor 1e-4).
#   • `foot_phase: 4.0` — phase-clock-driven swing/stance reward. Clock
#     ticks internally but NOT in obs (Cassie-style).
#   • `foot_stand: 1.0` — standstill double-support reward.
#
# Goal: match walk_rl_v4 deploy candidate's sim2sim transfer (~72/72 s)
# without any clock signal in the observation.

_base: walk_rl.yaml

phase:
  mode: input              # clock ticks internally (used for foot_phase reward),
                           # but `phase_clock` and `phase_freq_cmd` are NOT in
                           # obs.slots below → policy never sees the clock.

observation:
  history: 5
  skip: 2
  # 6 slots × 5 frames = 195 obs total. Includes BDX-R `projected_gravity`
  # (3-dim) instead of `base_euler` (2-dim).
  slots:
    - commands_3
    - base_ang_vel
    - projected_gravity
    - joint_pos_err
    - joint_vel
    - joint_tracking_err

reward:
  # ── BDX-R-inspired posture (the main innovation we're importing) ──────
  upright:       1.5
  upright_std:   0.316              # = √0.1 (BDX-R exact)
  pose_speed:    1.5
  pose_walking_threshold: 0.05      # BDX-R exact
  pose_running_threshold: 0.10
  pose_std_per_joint_standing:
    [0.05, 0.05, 0.05, 0.05, 0.05,
     0.05, 0.05, 0.05, 0.05, 0.05]
  pose_std_per_joint_walking:
    [0.15, 0.04, 0.50, 0.50, 0.10,
     0.15, 0.04, 0.50, 0.50, 0.10]
  pose_std_per_joint_running:
    [0.20, 0.04, 0.80, 0.80, 0.50,
     0.20, 0.04, 0.80, 0.80, 0.50]

  # ── BDX-R foot rewards (softer weights than BDX-R legs override since
  #    we ALSO keep walk_rl's foot_phase/foot_clr/foot_supt/foot_heit) ──
  feet_clearance_l1:       1.5      # was BDX-R legs -4.0 — much softer here
  feet_clearance_target:   0.06
  feet_clearance_cmd_threshold: 0.05
  feet_swing_height_peak:  1.0      # was BDX-R legs -3.0
  feet_swing_target:       0.06
  soft_landing:            1.0e-5   # half BDX-R's 2e-5

  # ── Walk_v34 clock-based gait shaping (Cassie-style — clock ticks but
  #    is invisible to obs) ─────────────────────────────────────────────
  foot_phase:    4.0
  foot_clr:      1.0
  foot_supt:     0.7
  foot_heit:     0.7
  foot_heit_form: clip              # legacy clip form
  foot_stand:    1.0                # standstill double-support reward

  # ── Walk_v34 tracking (linear shape — Qmini-tuned, don't change) ──────
  fwd_vel:        2.0
  lateral_vel:    1.5
  yaw_rat:        3.0
  fwd_err_slope:      3.0
  lateral_err_slope:  5.0
  yaw_err_slope:      3.0
  cmd_track_lp_alpha: 0.95          # KEEP — anti-Jensen-gaming
  reg_use_norm_scaling: false

  # ── Walk_v34 posture / balance (works for Qmini) ──────────────────────
  base_heit:        2.0
  base_heit_slope:  70.0
  base_heit_target: 0.45
  balance:          1.5
  twist:            2.5
  vertical_vel:     0.6
  ang_vel:          0.6
  base_acc:         0.01

  # ── Walk_v34 regulators (Qmini's low-kd hardware needs these) ─────────
  act_smo:        0.30
  jnt_vel:        0.001
  joint_tor:      0.0001
  power:          0.1
  act_const:      0.02
  sa_const:       0.01
  net_smo:        0.001
  net_out_val:    1.0e-05
  jnt_pos_err:    0.02
  foot_sft:       0.5
  foot_slip:      0.05
  foot_vz:        0.02
  foot_acc:       0.005
  feet_py:        0.5
  leg_width_rew:  0.5
  air_time:       1.0

  # ── BDX-R penalties we DEFER (would suppress needed active balance) ───
  body_ang_vel:      0.0           # OFF — see header note
  angular_momentum:  0.0           # OFF — same reason
  dof_pos_limits:    0.0           # OFF — existing twist_over termination handles tilt
  action_rate_l2:    0.0           # OFF — already covered by act_smo (2nd-deriv form)

  # ── BDX-R alternative shapes OFF ──────────────────────────────────────
  flat_orient_l2:    0.0
  base_height_l2:    0.0
  foot_clearance_l2: 0.0
  feet_slip_l2:      0.0

  constant:         0.3
  pmf:              0.0
  heading:          0.0
  yaw_smooth:       0.0
  feet_frc:         0.0

  component_clip_min: -4.0
  component_clip_max:  5.0

domain_rand:
  delay_joint_ranges: [1, 50]
  delay_angle_ranges: [1, 60]
  delay_rate_ranges:  [1, 60]

policy:
  # Keep walk_rl's 2-layer 512-256 ReLU — proven on Qmini.
  # BDX-R's 3-layer ELU didn't help (see bdxr_reproduction.md outcome).
  hidden_layers: [512, 256]
  activation: relu
  init_noise_std: 0.8

algorithm:
  entropy_coef: 0.0005             # KEEP walk_rl default (BDX-R's 0.01 stalled training)
  num_learning_epochs: 3
  discount_factor: 0.995
