# Balance v1 — Phase 1 of the two-stage recovery curriculum.
#
# WHY a separate phase:
#   v2c-v2m all tried to train get-up directly from fallen poses. v2k/v2l
#   showed action-bound alone can't bridge the credit-assignment gap; v2m
#   (RSI bootstrap from v2g's ballistic policy) collapsed because v2g's
#   "just-landed" frames have ballistic-not-quasi-static implicit dynamics
#   — PD seeded at sampled qpos = limp init = falls before policy acts.
#
# Pattern that works (ANYmal Lee 2020, HumanPlus, OmniH2O): train the
# trivial sub-skill "stand up from almost-standing" first, then expand the
# init distribution toward fallen. balance_v1 is the *trivial* sub-skill.
#
# Pool: data/balance_init_states.npz (1500 perturbed-and-settled standing
# poses, tilt < 15°, height ≥ 0.40 m). PD seeded at ref_joint_pos via
# init_pd_target='ref' so reset is consistent with PID equilibrium.
#
# Reward: dense Layer 1 (height + tilt) + Layer 2 (stability bonus when
# upright) + Layer 3 (smoothness with smooth-tanh torque saturation).
# Smooth-tanh has gradient through the MuJoCo torque clip — it *can* pull
# a policy off the saturation ceiling, unlike the hinge in v2g's
# torque_norm_sq.
#
# Success gate before launching Phase 2 (recovery_v3):
#   sim2sim ≥ 90%, |τ_peak| / τ_rated ≤ 1.5×, upright_frac ≥ 93%.
_base: recovery.yaml

task:
  init_states_path: data/balance_init_states.npz
  init_pd_target: ref               # PD pulls joints to ref_joint_pos at reset
  curriculum:
    enabled: false                  # single class of init — no curriculum needed

action:
  action_lowpass_alpha: 0.3         # community sweet spot (BD_X 0.25, Cassie 0.4)

# Pushes ON for balance — without disturbance the policy degenerates to
# "do nothing, let PD pull to ref". Pushes force active stabilization,
# which is the actual deployable balance skill.
domain_rand:
  push_robots: true
  max_push_vel_xy: 0.5              # base default — known-good magnitude
  max_push_rate_xyz: 0.5
  push_interval_s: 3.               # one push mid-episode (5s episodes)

observation:
  # Drop episode_progress — sim-only signal, no analogue at deploy time.
  # Reward shaping reads progress directly from episode_length_buf, not obs.
  history: 1
  slots:
    - base_euler                   # 2
    - base_ang_vel                 # 3
    - joint_pos_err                # 10
    - joint_vel                    # 10
    - joint_tracking_err           # 10
    - projected_gravity            # 3
                                    # total: 38

algorithm:
  entropy_coef: 0.003

reward:
  groups_enabled:
    - shaping_static
    - stability
    - smoothness
    - terminal
  # shaping_static — dense shaping toward nominal pose + upright orientation.
  # Switched from z-height tracking to ||q-q_ref|| tracking: PD-to-ref lands
  # at z≈0.44m anyway, so chasing height was redundant; the actual failure
  # mode is the *policy* squatting (q ≠ q_ref) for stability under pushes.
  # k_p=8 gives reward ~0.5 at success boundary (||err||=0.3), ~0 at squat
  # (||err||≈0.8). orientation_k 0.5 gives ~0.85 at 25° tilt (success edge).
  pose_match: 1.0
  pose_match_k: 8.0
  orientation: 1.0
  orientation_k: 0.5
  # stability — bonus when actually upright (z > 0.85·target AND tilt < 25°)
  stability: 2.0
  # smoothness; smooth-tanh saturation (gradient through clip)
  action_rate:           -0.01
  action_jerk:           -0.005
  joint_vel_pen:         -0.0005
  torque_pen:            -0.0001
  torque_sat_pen:         0.0
  torque_norm_sq_pen:     0.0
  torque_smooth_sat_pen: -0.05      # the bug-fix term — gradient survives MuJoCo clip
  # terminal — ±5 sparse signal
  terminal:        5.0
