# walk_v5 — walk_v4 + value/return normalization (PopArt-lite).
#
# walk_v4 trained well but Loss/value was noisy (0.4-3.0 range, spikes to
# 100 on resume). Critic regresses raw returns 0-50, so MSE error is 1-2
# per step regardless of how good the critic is.
#
# normalize_value=True: critic predicts in (R-μ)/σ space, PPO denormalizes
# for GAE. Value loss should drop to ~0.1 range and stay flat. Should also
# stabilize training when reward components have very different scales.
_base: walk_v4.yaml

algorithm:
  normalize_value: true
