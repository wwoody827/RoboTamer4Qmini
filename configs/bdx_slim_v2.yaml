# BD_X slim v2 — v1 was too aggressive, sim2sim stagnated:
#   - survive_time_fr3.0 = 0.23s at iter 500 AND iter 2000 (never learned carpet)
#   - pitch_rms_bwd = 34° (backward gait pitches heavily forward)
#   - yaw_err drifted 0.38 → 0.69 over training
#
# Revived:
#   - foot_sft  (foot soft-landing) — main missing impact regularizer; likely
#     responsible for the fr=3.0 collapse (no penalty for slam = no learning of
#     gentle touchdown that transfers across friction)
#   - feet_py   (foot pitch anchor) — likely source of pitch_rms_bwd = 34°
#
# Still disabled (these looked harmless):
#   - air_time  (clock pins phase already)
#   - net_smo, net_out_val  (redundant with act_smo + action scaling)
#   - foot_vz, foot_acc, feet_frc  (overlap with foot_sft + foot_slip)
#   - sa_const, act_const  (revisit if gait collapses again)
_base: bdx.yaml

reward:
  # revived — predicted root causes of v1 failures
  foot_sft: 2.7
  feet_py: 0.5

  # still redundant with foot_sft + foot_slip
  foot_vz: 0.0
  foot_acc: 0.0
  feet_frc: 0.0

  # still held back — revisit if policy crab-walks or yaw-locks
  sa_const: 0.0
  act_const: 0.0

  # redundant action regularizers
  net_smo: 0.0
  net_out_val: 0.0

  # clock already pins phase
  air_time: 0.0
