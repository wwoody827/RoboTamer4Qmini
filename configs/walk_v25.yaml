# walk_v25 — direct attack on mini-step attractor.
#
# Discovery from walk_v20 fresh: stride collapsed to 0.04-0.07m (cmd 0.5,
# target 0.2m → 20-35% of target). walk_v11 best ckpts emerged after iter
# 7600 partly by luck escaping mini-step. We need explicit reward signal
# against mini-step.
#
# Two complementary changes (both single yaml + code already in place):
#   1. fwd_vel weight 2 → 6 (stronger pull toward cmd_vx tracking).
#      Symmetric |err|, no overshoot bias. Reward range [-1, +2] → [-3, +6].
#
#   2. air_time weight 0 → 1.5 (cmd_freq-aware spike at touchdown):
#      target_swing = (1 - support_ratio) / cmd_freq
#      reward = (swing_dur - target_swing).clip(±0.5) at first_contact
#      Mini-step has swing duration ~0.01s vs target ~0.16s → -0.15
#      penalty per touchdown event. Direct attack on mini-step pattern.
#      legged_gym standard formulation, validated on Cassie/Go1.
#
# Inherits walk_v20 (walk_v11 stack + Fix #3 hip_yaw gate).
_base: walk_v20.yaml

reward:
  fwd_vel: 6.0      # 2 → 6 — stronger vx tracking pull (target cmd_vx)
  air_time: 1.5     # 0 → 1.5 — penalize mini-step (short swing duration)
