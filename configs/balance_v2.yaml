# Balance v2 — same as balance_v1 but with strided frame stacking.
# obs_history=3, obs_skip=4 → policy sees 3 frames spanning 120ms (vs 30ms).
# Required because recovery_v9 will use the same obs config and we can't
# resume from balance_v3 (history=1) into recovery_v9 (history=3) — input
# layer dim mismatch.
_base: balance_v1.yaml

observation:
  history: 3
  skip: 4

# Generic slot-driven mirror (Phase 4): each obs slot self-describes its
# L↔R transform. recovery.yaml had `use_mirror_augmentation: false` because
# the old per-task mirror classes only handled BIRL/BDX layouts; the new
# Mirror class works for any registered slot list.
runner:
  use_mirror_augmentation: true
  mirror_weight: 0.5

