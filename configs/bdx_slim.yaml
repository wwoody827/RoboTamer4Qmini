# BD_X slim — same stack as bdx.yaml but with the "redundant-for-blind-walking"
# reward terms disabled. External phase clock drives timing, so we trust
# foot_phase + physics instead of micro-managing contacts and raw-network shape.
#
# Disabled vs bdx.yaml:
#   - foot_vz, foot_acc, foot_sft, feet_frc : overlapping impact/slip regularizers
#     (keep foot_slip as the single representative)
#   - feet_py                                : foot pitch anchor (risk: toe-only gaits)
#   - sa_const, act_const                    : support/swing pose anchors
#     (risk: crab-walk / yaw-lock — revisit if gait looks pathological)
#   - net_smo, net_out_val                   : redundant with act_smo + action scaling
#   - air_time                               : fights external clock, causes big strides
_base: bdx.yaml

reward:
  # impact / slip regularizers — keep only foot_slip
  foot_vz: 0.0
  foot_acc: 0.0
  foot_sft: 0.0
  feet_frc: 0.0

  # foot posture anchor
  feet_py: 0.0

  # support/swing pose anchors
  sa_const: 0.0
  act_const: 0.0

  # redundant action regularizers
  net_smo: 0.0
  net_out_val: 0.0

  # clock already pins phase
  air_time: 0.0
