# walk_rl — RL-only best baseline (inherits walk_bdx_base). Was walk_v34 in development.
#
# Key insight: cmd_track_lp_alpha=0.95 makes tracking error use a 290 ms EMA
# of body velocity instead of per-step. Within-stride gait sway averages out,
# only DC offset (real tracking) drives the reward. This defeats Jensen-style
# gaming where ±0.3 oscillation around mean=0 mimicked +0.3 tracking under
# per-step |err| reward. Result: yaw_drift collapses 28×, strafe becomes real.
#
# Result vs walk_v27 (the previous best):
#   vx_fwd_err (steady):  0.058 → 0.038   (-34 %)
#   yaw_err (steady):     0.238 → 0.142   (-40 %)
#   yaw_drift_passive:    ~0.42 → 0.015   (28× better)
#   strafe disp_y:        ~5 m (no strafe) → 1.59 m  (first time real)
#   vx_bwd_err:           0.070 → 0.100   (mild regression; remaining asymmetry)
#
# Best ckpts: policy_2800 (unified), policy_3200 (best disp_y + freq lock),
#             policy_4200 (best yaw). Full report: docs/walk_v34_summary.md
_base: walk_bdx_base.yaml

reward:
  # ─── Regulator calibration (industry-aligned scale; legged_gym / Unitree G1 / humanoid-gym).
  # reg_use_norm_scaling=false → regulators stop being amplified by 1/lin_vel_x_norm.
  # In pure_yaw mode this used to 2× regs, killing tracking. With it off, regs are
  # constant and tracking-vs-reg ratio matches industry (~50–100:1).
  reg_use_norm_scaling: false
  act_smo:        0.30      # was 1.5 — 5× lower, still smooth enough for sim2real
  act_const:      0.02
  sa_const:       0.01
  jnt_pos_err:    0.02
  foot_sft:       0.5
  foot_slip:      0.05
  foot_vz:        0.02
  foot_acc:       0.005
  jnt_vel:        0.001     # matches legged_gym dof_vel = -1e-3
  joint_tor:      0.0001
  net_smo:        0.001
  net_out_val:    1.0e-05
  base_acc:       0.01

  # ─── Tracking weights — industry-aligned, lateral promoted to match yaw urgency.
  fwd_vel:        2.0       # walk_v25/v27 bumped to 4-6; this is back to base
  yaw_rat:        3.0       # was 8; healthier ratio with calibrated regs
  lateral_vel:    2.0       # was 0.7; same urgency as yaw

  # ─── Tracking slopes — finer gradient near 0 so policy chases small errors.
  fwd_err_slope:      3.0
  lateral_err_slope:  5.0
  yaw_err_slope:      3.0

  # ─── 🏆 LP filter on tracked vel/ang for reward computation (the breakthrough).
  cmd_track_lp_alpha: 0.95  # 290 ms EMA TC at 67 Hz policy rate

  # ─── Gait shaping (kept from walk_v27 line).
  air_time: 1.0             # cmd_freq-aware swing-duration matching

command:
  resampling_time: 10.0     # was 5; full episode = single cmd, gait converges
  regime_weights: [1.0, 2.0, 1.0, 1.5, 1.5]
  # mode 0/1/2/3/4 = pure_vx / pure_vy / pure_yaw / vx+vy / vx+yaw
  # weights → 14% / 28% / 14% / 21% / 21% (pure_vy bumped from default 17%)
